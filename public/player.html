<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Hitster — Join Game</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
  <script>(function(){var t=localStorage.getItem('hitster_theme');if(t)document.documentElement.classList.add(t);})();</script>
  <style>
    /* ── Player-page specific overrides ── */
    body { background: var(--bg, #f5f5f5); min-height: 100dvh; margin: 0; }
    #app { width: 100%; padding: 0 0 48px; display: flex; flex-direction: column; gap: 0; min-height: 100dvh; box-sizing: border-box; }

    /* Cards */
    .p-card { background: #fff; border-radius: 0; padding: 16px; box-shadow: none; border-bottom: 1px solid var(--grey-100, #f3f4f6); }

    /* Header */
    .p-header { background: var(--green-dark, #004444); color: #fff; border-radius: 0; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .p-header-title { font-size: 1.1rem; font-weight: 800; }
    .p-room-code { font-size: 0.75rem; font-weight: 700; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 3px 10px; letter-spacing: 0.08em; }
    .p-header > span:last-child { font-size: 0.65rem; opacity: 0.65; }

    /* Join form */
    .p-form { display: flex; flex-direction: column; gap: 12px; }
    .p-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey-500, #6b7280); margin-bottom: 2px; }
    .p-input, .p-select { width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit; border: 2px solid var(--grey-100, #f3f4f6); border-radius: var(--radius-sm, 8px); background: #fff; color: var(--grey-900, #111); box-sizing: border-box; }
    .p-input:focus, .p-select:focus { outline: none; border-color: var(--green, #007272); }
    .p-btn { width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; font-family: inherit; background: var(--green, #007272); color: #fff; border: none; border-radius: var(--radius-sm, 8px); cursor: pointer; transition: background 0.15s; }
    .p-btn:hover:not(:disabled) { background: #005a5a; }
    .p-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .p-btn-ghost { background: transparent; border: 2px solid var(--grey-200, #e5e7eb); color: var(--grey-700, #374151); }
    .p-btn-ghost:hover:not(:disabled) { border-color: var(--green, #007272); color: var(--green, #007272); background: transparent; }

    /* Player list */
    .p-player-list { display: flex; flex-direction: column; gap: 8px; }
    .p-player-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--grey-100, #f3f4f6); }
    .p-player-row:last-child { border-bottom: none; }
    .p-player-name { font-size: 0.9rem; font-weight: 600; }
    .p-player-team { font-size: 0.75rem; color: var(--grey-500); }

    /* Score chips */
    .p-scores { display: flex; flex-wrap: wrap; gap: 8px; }
    .p-score-chip { background: var(--grey-50, #f9fafb); border: 1px solid var(--grey-100); border-radius: 20px; padding: 6px 14px; font-size: 0.82rem; font-weight: 600; color: var(--grey-700); }
    .p-score-chip.active { background: var(--green, #007272); border-color: var(--green); color: #fff; }

    /* Timeline */
    .p-timeline-wrap { overflow-x: auto; padding-bottom: 4px; }
    .p-timeline-row { display: flex; align-items: center; gap: 0; min-width: max-content; }
    .p-slot { width: 44px; min-width: 44px; height: 56px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .p-slot-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--green, #007272); background: #fff; color: var(--green); font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.12s; display: flex; align-items: center; justify-content: center; }
    .p-slot-btn:hover { background: var(--green); color: #fff; }
    .p-slot.selected .p-slot-btn { background: var(--green); color: #fff; transform: scale(1.15); }
    .p-slot-dot { width: 6px; height: 6px; background: var(--grey-200, #e5e7eb); border-radius: 50%; }
    .p-tc { min-width: 80px; max-width: 100px; background: var(--grey-50, #f9fafb); border: 1px solid var(--grey-100); border-radius: 8px; padding: 8px; text-align: center; }
    .p-tc-year { font-size: 1rem; font-weight: 800; }
    .p-tc-title { font-size: 0.68rem; font-weight: 600; color: var(--grey-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .p-tc-artist { font-size: 0.62rem; color: var(--grey-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Card reveal */
    .p-card-reveal { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .p-card-art { width: 90px; height: 90px; border-radius: 10px; object-fit: cover; background: var(--grey-100); }
    .p-card-year { font-size: 2rem; font-weight: 900; color: var(--green, #007272); }
    .p-card-title { font-size: 1.1rem; font-weight: 700; color: var(--grey-900); }
    .p-card-artist { font-size: 0.88rem; color: var(--grey-500); }

    /* Result banner */
    .p-result { padding: 12px 16px; border-radius: 0; font-weight: 700; text-align: center; font-size: 0.95rem; }
    .p-result.correct { background: #dcfce7; color: #166534; }
    .p-result.wrong   { background: #dc2626; color: #fff; font-size: 1rem; letter-spacing: 0.01em; }

    /* Wrong card — red border + shadow */
    .p-card--wrong {
      border: 2px solid #dc2626 !important;
      background: #fff5f5 !important;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15), 0 4px 16px rgba(220, 38, 38, 0.2);
    }
    .p-card--wrong .p-card-year  { color: #dc2626 !important; }
    .p-card--wrong .p-card-title { color: #7f1d1d; }
    .p-card--wrong .p-card-artist{ color: #b91c1c; }

    /* Steal button */
    .p-steal { width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 600; border-radius: var(--radius-sm, 8px); border: 2px dashed var(--grey-200); color: var(--grey-400); background: transparent; cursor: not-allowed; font-family: inherit; }
    .p-btn-steal-pre { width: 100%; padding: 12px; font-size: 0.9rem; font-weight: 700; font-family: inherit; background: #fff7ed; border: 2px solid #f97316; color: #c2410c; border-radius: var(--radius-sm, 8px); cursor: pointer; transition: background 0.12s; }
    .p-btn-steal-pre:hover { background: #ffedd5; }
    .p-presteal-confirm { background: #fff7ed; border: 1px solid #f97316; border-radius: 10px; padding: 12px; margin-top: 8px; }
    .p-steal-committed { background: #fff7ed; border: 1px solid #f97316; border-radius: 10px; padding: 10px 14px; font-size: 0.88rem; font-weight: 700; color: #c2410c; text-align: center; margin-top: 8px; }
    .p-next-banner { background: var(--green, #007272); color: #fff; border-radius: 0; padding: 12px 16px; font-size: 0.9rem; font-weight: 700; text-align: center; }

    /* Scoreboard + card decks */
    .p-scoreboard { display: flex; flex-direction: column; gap: 0; }
    .p-team-deck {
      background: var(--grey-50, #f9fafb);
      border: none;
      border-bottom: 1px solid var(--grey-100, #f3f4f6);
      padding: 12px 16px;
    }
    .p-team-deck--current { background: #f0fdfa; border-left: 4px solid var(--green, #007272); }
    .p-team-deck--mine    { background: #f5f3ff; border-left: 4px solid #6366f1; box-shadow: none; }
    .p-team-deck--current.p-team-deck--mine { background: #f0fdfa; border-left: 4px solid var(--green); box-shadow: none; }
    .p-deck-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .p-deck-name   { font-size: 0.88rem; font-weight: 700; color: var(--grey-800); flex: 1; }
    .p-team-deck--mine .p-deck-name { color: #4f46e5; }
    .p-deck-count  { font-size: 0.72rem; font-weight: 600; color: var(--grey-500); }
    .p-deck-badge  { font-size: 0.65rem; font-weight: 700; border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
    .p-deck-badge--playing { background: var(--green, #007272); color: #fff; }
    .p-deck-badge--me      { background: #6366f1; color: #fff; font-size: 0.72rem; padding: 3px 10px; }
    .p-deck-empty { font-size: 0.75rem; color: var(--grey-400); font-style: italic; margin: 0; }
    .p-deck-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .p-deck-card {
      flex-shrink: 0;
      background: #fff;
      border: 1px solid var(--grey-200, #e5e7eb);
      border-radius: 8px;
      padding: 6px 8px;
      min-width: 58px;
      text-align: center;
    }
    .p-deck-year  { font-size: 0.88rem; font-weight: 800; line-height: 1.2; }
    .p-deck-title { font-size: 0.6rem; color: var(--grey-500); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }

    /* Status banners */
    .p-status { text-align: center; color: var(--grey-500); font-size: 0.9rem; padding: 8px 16px; }
    .p-waiting { font-size: 0.85rem; color: var(--grey-400); text-align: center; }
    .p-catchup { background: #fffbeb; border-bottom: 1px solid #fde68a; padding: 10px 16px; font-size: 0.82rem; color: #92400e; text-align: center; }
    .p-error { background: #fee2e2; border-left: 4px solid #fecaca; padding: 16px; text-align: center; color: #991b1b; font-weight: 600; }
    .p-section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey-400); margin-bottom: 4px; }
    .p-connecting { text-align: center; color: var(--grey-400); padding: 40px 0; }
  </style>
</head>
<body>
  <div id="app">
    <div class="p-connecting">Connecting…</div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="common.js"></script>
  <script src="player.js"></script>
</body>
</html>
